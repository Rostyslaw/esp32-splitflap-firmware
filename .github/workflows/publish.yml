name: Publish delivered firmware
on:
  push:
    branches: [delivery]
    paths: [delivery.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-firmware-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/delivery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Test immutable publication and signature validation
        run: python -m unittest discover -s tests -v
      - name: Verify delivered package and publish or compare existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py
